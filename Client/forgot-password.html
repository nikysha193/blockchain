<!DOCTYPE html> <!-- HTML5 -->

<html lang="en"> <!-- Язык -->

<head>

    <meta charset="UTF-8"> <!-- Кодировка -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Адаптация -->

    <title>Forgot Password</title> <!-- Название вкладки -->

    <link rel="stylesheet" href="style.css"> <!-- Общий стиль -->

</head>

<body>


    <div class="top-controls">

        <select id="languageSelect">

            <option value="en">English</option>

            <option value="ru">Русский</option>

            <option value="he">עברית</option>

        </select>

        <button id="themeButton" type="button">Dark theme</button>

    </div>


    <div class="auth-layout">


        <div class="blockchain-art" aria-hidden="true">

            <div class="chain-block block-one">01</div>

            <div class="chain-line"></div>

            <div class="chain-block block-two">02</div>

            <div class="chain-line"></div>

            <div class="chain-block block-three">03</div>

        </div>


        <div class="login-container">

            <div class="security-badge">

                <span class="security-icon">◇</span>

                <span id="securityText">SECURE RECOVERY</span>

            </div>


            <h1 id="title">Reset Password</h1>

            <p id="subtitle" class="subtitle">
                Enter your email to recover access
            </p>


            <form id="forgotForm">

                <label id="emailLabel" for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <button id="resetButton" type="submit">Continue</button>

            </form>


            <p id="message"></p>


            <p class="switch-page">

                <a id="backToLogin" href="index.html">← Back to Login</a>

            </p>

        </div>

    </div>


    <script src="forgot-password.js"></script>

</body>

</html>
