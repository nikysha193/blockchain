<!DOCTYPE html> <!-- HTML5 -->

<html lang="en"> <!-- Язык по умолчанию английский -->

<head> <!-- Служебная часть -->

    <meta charset="UTF-8"> <!-- Поддержка языков -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Адаптация -->

    <title>Register</title> <!-- Название вкладки -->

    <link rel="stylesheet" href="style.css"> <!-- CSS -->

</head>

<body>


    <div class="top-controls"> <!-- Верхние элементы -->

        <select id="languageSelect"> <!-- Язык -->

            <option value="en">English</option>

            <option value="ru">Русский</option>

            <option value="he">עברית</option>

        </select>

        <button id="themeButton" type="button">Dark theme</button> <!-- Тема -->

    </div>


    <div class="auth-layout"> <!-- Общий блок -->


        <div class="blockchain-art" aria-hidden="true"> <!-- Blockchain цепочка -->

            <div class="chain-block block-one">01</div>

            <div class="chain-line"></div>

            <div class="chain-block block-two">02</div>

            <div class="chain-line"></div>

            <div class="chain-block block-three">03</div>

        </div>


        <div class="login-container"> <!-- Карточка Register -->

            <div class="security-badge"> <!-- Badge -->

                <span class="security-icon">◇</span>

                <span id="securityText">BLOCKCHAIN SECURED</span>

            </div>


            <h1 id="title">Create Account</h1> <!-- Заголовок -->

            <p id="subtitle" class="subtitle">Create your secure identity</p> <!-- Подзаголовок -->


            <form id="registerForm"> <!-- Register Form -->

                <label id="usernameLabel" for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >


                <label id="emailLabel" for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                    required
                >


                <label id="passwordLabel" for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >


                <label id="confirmPasswordLabel" for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Repeat password"
                    required
                >


                <button id="registerButton" type="submit">Sign Up</button>

            </form>


            <p id="message"></p>


            <p class="switch-page">

                <span id="loginQuestion">Already have an account?</span>

                <a id="loginLink" href="index.html">Login</a>

            </p>

        </div>

    </div>


    <script src="register.js"></script>

</body>

</html>
